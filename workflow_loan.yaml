# =============================================================================
# MICROSOFT FOUNDRY MULTI-AGENT WORKFLOW
# Loan Application Pre-Screening
# =============================================================================
#
# WHAT THIS DOES:
#   Automatically pre-screens loan applications using 4 AI agents chained
#   together. Each agent does one specific job and passes its output to
#   the next agent via the shared conversation context.
#
# THE 4 AGENTS:
#   1. loan-doc-extractor      Reads the application + income docs, pulls out key fields
#   2. loan-financial-analyzer Calculates DTI ratio, LTV ratio, affordability
#   3. loan-risk-scorer        Checks policy rules, scores risk 0–100, recommends decision
#   4. loan-notifier           Sends email via SendEmail MCP tool (Logic App)
#
# HOW AGENTS CHAIN (new Foundry portal pattern):
#   In the sequential workflow, each agent automatically receives the full
#   conversation history — no explicit input mapping needed.
#   input.messages: "" means "use the accumulated conversation context"
#
# HUMAN-IN-THE-LOOP (HITL):
#   The workflow pauses at the Question node (Step 5) after risk scoring.
#   The Flask backend detects this pause and shows APPROVE / DECLINE buttons.
#   The underwriter's decision is sent back to resume the workflow.
#
# NOTE ON POLICY DATA:
#   No database needed. The Flask backend (loan_portal.py) reads loan_policies.json
#   and appends the policy rules to the document text before sending to this workflow.
#   The loan-risk-scorer agent reads those rules directly from the conversation.
#
# NOTE ON DOCUMENT INTELLIGENCE:
#   PDF loan applications are pre-processed by Azure Document Intelligence
#   (custom model: loan-form-extractor-2) before reaching this workflow.
#   The extracted fields arrive as structured text — agents treat them the same
#   as plain text documents.
#
# =============================================================================

kind: workflow
trigger:
  kind: OnConversationStart
  id: trigger_loan_wf
  actions:

    # =========================================================================
    # STEP 1: Generate a unique Case ID
    # Combines the literal "LOAN-" prefix with the Foundry conversation ID
    # to create a traceable reference for this application session.
    # =========================================================================
    - kind: SetVariable
      id: init-case-id
      variable: Local.case_id
      value: ="LOAN-" & System.ConversationId

    # =========================================================================
    # STEP 2: Collect documents from the user
    #
    # The Flask portal sends:
    #   - Loan Application text (plain text or pre-extracted PDF fields via DI)
    #   - Income Verification text
    #   - Lending policy rules (from loan_policies.json)
    # All combined into one message.
    #
    # skipQuestionMode: SkipOnFirstExecutionIfVariableHasValue
    #   → If the Flask backend already sent the documents, skip re-asking.
    # =========================================================================
    - kind: Question
      variable: Local.loan_documents
      id: get-documents
      entity: StringPrebuiltEntity
      skipQuestionMode: SkipOnFirstExecutionIfVariableHasValue
      prompt: |-
        Welcome to the Loan Pre-Screening Workflow
        Case ID: {{Local.case_id}}

        Please paste the Loan Application and Income Verification documents below.

    # =========================================================================
    # STEP 3: Extract structured data from both documents
    #
    # Agent reads: application text + income text (full conversation context)
    # Agent outputs: structured list of all applicant fields
    #   - Applicant name, DOB, SSN last 4
    #   - Loan amount, type, term, property value
    #   - Self-reported income, debt payments, credit score
    #   - Employment details, verified income
    # =========================================================================
    - kind: InvokeAzureAgent
      id: invoke-extractor
      agent:
        name: loan-doc-extractor
      conversationId: =System.ConversationId
      input:
        messages: ""   # reads full conversation context automatically
      output:
        autoSend: true

    # =========================================================================
    # STEP 4: Calculate financial ratios
    #
    # Agent reads: extracted fields from Step 3 (via conversation context)
    # Agent outputs:
    #   - DTI ratio (Debt-to-Income) with threshold classification
    #   - LTV ratio (Loan-to-Value) with PMI assessment
    #   - Income consistency check (self-reported vs verified)
    #   - Estimated monthly payment and housing ratio
    # =========================================================================
    - kind: InvokeAzureAgent
      id: invoke-analyzer
      agent:
        name: loan-financial-analyzer
      conversationId: =System.ConversationId
      input:
        messages: ""   # reads extractor output from conversation context
      output:
        autoSend: true

    # =========================================================================
    # STEP 5: Check policy rules and score risk
    #
    # Agent reads: extracted data + financial ratios + policy JSON (all in context)
    # Agent outputs:
    #   - Policy compliance check per rule (PASS / FAIL)
    #   - Risk score 0–100 with breakdown
    #   - Risk level: LOW / MEDIUM / HIGH
    #   - Recommendation: APPROVE / REFER / DECLINE
    # =========================================================================
    - kind: InvokeAzureAgent
      id: invoke-risk-scorer
      agent:
        name: loan-risk-scorer
      conversationId: =System.ConversationId
      input:
        messages: ""   # reads analyzer output (includes policy JSON) from context
      output:
        autoSend: true

    # =========================================================================
    # STEP 6: Underwriter Decision Gate (Human-in-the-Loop)
    #
    # The workflow PAUSES here and waits for the underwriter's decision.
    # The Flask backend (loan_portal.py) detects this pause via SSE streaming
    # and shows APPROVE / DECLINE buttons in the web portal.
    # The underwriter clicks a button → Flask sends the decision back here.
    #
    # skipQuestionMode: SkipOnFirstExecutionIfVariableHasValue
    #   → Prevents re-asking if the decision was already provided.
    # elseActions: GotoAction loops back here if input is invalid.
    # =========================================================================
    - kind: Question
      variable: Local.underwriter_decision
      id: approval-question
      entity: StringPrebuiltEntity
      skipQuestionMode: SkipOnFirstExecutionIfVariableHasValue
      prompt: |
        UNDERWRITER DECISION REQUIRED
        Case ID: {{Local.case_id}}

        Review the risk assessment above and enter your decision.

        Type APPROVE or DECLINE:

    # =========================================================================
    # STEP 7: Route based on underwriter's decision
    #
    # Checks the decision and routes to the appropriate notifier branch.
    # Both APPROVE and DECLINE use the same loan-notifier agent —
    # the agent reads the decision from conversation context and composes
    # the appropriate email, then sends it via the SendEmail MCP tool.
    # =========================================================================
    - kind: ConditionGroup
      id: check-decision

      conditions:

        # ----- APPROVED: Compose and send approval email -----
        - id: condition-approved
          condition: =Upper(Local.underwriter_decision) = "APPROVE"
          actions:
            - kind: InvokeAzureAgent
              id: invoke-approval-email
              agent:
                name: loan-notifier
              conversationId: =System.ConversationId
              input:
                messages: ""   # reads full context including APPROVE decision
              output:
                autoSend: true

        # ----- DECLINED: Compose and send decline email -----
        - id: condition-declined
          condition: =Upper(Local.underwriter_decision) = "DECLINE"
          actions:
            - kind: InvokeAzureAgent
              id: invoke-rejection-email
              agent:
                name: loan-notifier
              conversationId: =System.ConversationId
              input:
                messages: ""   # reads full context including DECLINE decision
              output:
                autoSend: true

      # ----- Invalid input: loop back and ask again -----
      elseActions:
        - kind: GotoAction
          id: goto-decision
          actionId: approval-question   # points back to Step 6

# =============================================================================
# WORKFLOW METADATA
# =============================================================================
id: ""
name: Loan-Prescreening-Workflow
description: |
  Loan application pre-screening using 4 AI agents on Microsoft Foundry.
  Lending policies loaded from loan_policies.json — no database needed.
  PDF extraction via Azure Document Intelligence (loan-form-extractor-2).
  Email notifications via SendEmail MCP tool (Logic App Standard).
  Agents: loan-doc-extractor, loan-financial-analyzer, loan-risk-scorer, loan-notifier
